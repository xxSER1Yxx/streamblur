name: Сборка EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# Что делает этот файл:
#   1. Прогоняет тесты (Linux) — чтобы не собирать заведомо сломанное.
#   2. Собирает портативную версию (Windows) → StreamBlur-portable-<версия>.zip
#   3. Собирает установщик Inno Setup → StreamBlur-Setup-<версия>.exe
#   4. На теге v* публикует релиз и прикрепляет оба файла.

permissions:
  contents: write

jobs:
  tests:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # rapidocr тянет opencv-python (GUI), который затирает cv2 от headless.
          # Убираем его и ставим headless начисто — иначе в EXE попадают Qt/GStreamer DLL.
          pip uninstall -y opencv-python
          pip install --force-reinstall --no-deps "opencv-python-headless>=4.8,<5"
          python -c "import cv2; print('cv2 из:', cv2.__file__)"
          pip install pytest

      - name: pytest
        run: python -m pytest -q

  build-windows:
    name: Сборка Windows
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # rapidocr тянет opencv-python (GUI), который затирает cv2 от headless.
          # Убираем его и ставим headless начисто — иначе в EXE попадают Qt/GStreamer DLL.
          pip uninstall -y opencv-python
          pip install --force-reinstall --no-deps "opencv-python-headless>=4.8,<5"
          python -c "import cv2; print('cv2 из:', cv2.__file__)"
          pip install pyinstaller

      # Папка, а не один файл: старт мгновенный, без распаковки во временную папку.
      - name: PyInstaller
        run: python -m PyInstaller packaging/streamblur.spec --noconfirm --clean

      - name: Проверка, что EXE вообще запускается
        shell: pwsh
        run: |
          $exe = ".\dist\StreamBlur\StreamBlur.exe"
          if (-not (Test-Path $exe)) { throw "EXE не найден: $exe" }
          Write-Host "--- что лежит в dist ---"
          Get-ChildItem ".\dist\StreamBlur" | Select-Object -First 8 |
            ForEach-Object { Write-Host ("  {0}  {1}" -f $_.Name, $_.Length) }
          $env:PYTHONUNBUFFERED = "1"
          $env:PYTHONFAULTHANDLER = "1"
          # cmd /c с перенаправлением в файлы переживает и аварийное завершение,
          # и отсутствие консоли у процесса — прямой вызов из pwsh в этом случае
          # не давал ни вывода, ни кода возврата.
          cmd /c "`"$exe`" doctor > smoke_out.txt 2> smoke_err.txt"
          $code = $LASTEXITCODE
          Write-Host "--- код возврата: $code ---"
          Write-Host "--- stdout ---"
          if (Test-Path smoke_out.txt) { Get-Content smoke_out.txt | ForEach-Object { Write-Host $_ } }
          Write-Host "--- stderr ---"
          if (Test-Path smoke_err.txt) { Get-Content smoke_err.txt | ForEach-Object { Write-Host $_ } }
          if ($code -ne 0) { exit 1 }
          # Вывод обязан быть непустым: молчаливый EXE — это ровно тот баг,
          # из-за которого console=False делал CLI-команды бесполезными.
          if (-not (Test-Path smoke_out.txt) -or -not (Get-Content smoke_out.txt -Raw)) {
            Write-Host "EXE завершился без вывода — консольного потока нет"
            exit 1
          }

      - name: Версия из тега
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -like "v*") { $v = $ref.Substring(1) } else { $v = "0.0.0-dev" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Портативная версия (zip)
        shell: pwsh
        run: |
          Copy-Item README.md dist\StreamBlur\README-RU.txt
          Compress-Archive -Path dist\StreamBlur\* `
            -DestinationPath "StreamBlur-portable-${{ steps.ver.outputs.version }}.zip" -Force

      # Inno Setup в образ windows-latest входит не всегда, поэтому ставим сами.
      # chocolatey уже есть в образе — ничего качать руками не нужно.
      - name: Установить Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Собрать установщик
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe не найден после установки Inno Setup" }
          & $iscc "packaging\installer.iss"
          Move-Item "packaging\Output\StreamBlur-Setup-*.exe" `
                    "StreamBlur-Setup-${{ steps.ver.outputs.version }}.exe"

      - name: Артефакты
        uses: actions/upload-artifact@v4
        with:
          name: streamblur-windows
          path: |
            StreamBlur-portable-*.zip
            StreamBlur-Setup-*.exe

  release:
    name: Релиз
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: streamblur-windows

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            StreamBlur-portable-*.zip
            StreamBlur-Setup-*.exe
          generate_release_notes: true
